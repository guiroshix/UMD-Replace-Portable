name: Build UMD-Replace All

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 gcc-aarch64-linux-gnu

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: umd-replace-binaries
          path: |
            umd-replace-linux-x86_64
            umd-replace-linux-arm64
            umd-replace-android-arm64
            umd-replace-win64.exe
            umd-replace-win32.exe