name: Build UMD-Replace All

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Compile Linux x86_64
        run: |
          gcc src/main.c -03 -g umd-replace-linux-x86_64

      - name: Compile Windows x64
        run: |
          x86_64-w64-mingw32-gcc src/main.c -O3 -o umd-replace-win64.exe

      - name: Compile Windows x86
        run: |
          i686-w64-mingw32-gcc src/main.c -O3 -o umd-replace-win32.exe

      - name: Upload x86 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-x86
          path: |
            umd-replace-linux-x86_64
            umd-replace-win64.exe
            umd-replace-win32.exe


  build-arm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 Cross Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Compile Linux ARM64
        run: |
          aarch64-linux-gnu-gcc src/main.c -O3 -o umd-replace-linux-arm64

      - name: Compile Android ARM64
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang \
            src/main.c \
            -O3 \
            -o umd-replace-android-arm64

      - name: Upload ARM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-arm
          path: |
            umd-replace-linux-arm64
            umd-replace-android-arm64
